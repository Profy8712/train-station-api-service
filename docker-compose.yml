services:
  db:
    image: postgres:13-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    volumes:
      - ./staticfiles:/app/staticfiles:rw
      - ./media:/app/media:rw
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    user: "1000:1000"
    restart: unless-stopped

volumes:
  postgres_data:
    